name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Validate & Lint ─────────────────────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate generated specs (anti-pattern check)
        run: npm run validate:ai

      - name: Lint
        run: npm run lint
        continue-on-error: true   # Warning only — không block CI

      - name: Format check
        run: npm run format:check
        continue-on-error: true   # Warning only

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: E2E Tests (${{ matrix.env }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        env: [dev]          # Thêm stg/uat khi có env CI secrets

    env:
      TEST_ENV: ${{ matrix.env }}
      ACCOUNT_PROFILE: admin
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment file
        run: |
          if [ -f "config/environments/${{ matrix.env }}.env" ]; then
            echo "Using existing ${{ matrix.env }}.env"
          else
            echo "Falling back to ${{ matrix.env }}.env.example"
            cp config/environments/${{ matrix.env }}.env.example config/environments/${{ matrix.env }}.env
          fi

      - name: Override env with CI secrets (nếu có)
        run: |
          if [ -n "${{ secrets.BASE_URL }}" ]; then
            echo "BASE_URL=${{ secrets.BASE_URL }}" >> config/environments/${{ matrix.env }}.env
          fi
          if [ -n "${{ secrets.ADMIN_USERNAME }}" ]; then
            echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}" >> config/environments/${{ matrix.env }}.env
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> config/environments/${{ matrix.env }}.env
          fi
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (Chromium)
        run: npx playwright test --project=chromium
        env:
          TEST_ENV: ${{ matrix.env }}

      # ── Artifacts ────────────────────────────────────────────────────────────
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.env }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (JUnit + JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.env }}
          path: test-results/
          retention-days: 30

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.env }}
          path: allure-results/
          retention-days: 30

      - name: Upload traces & artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-artifacts-${{ matrix.env }}
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/*.webm
          retention-days: 14
